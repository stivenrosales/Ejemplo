<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysiva - Asistente Virtual</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Landing page background -->
    <div class="landing-page">
        <div class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">ELYSIVA</h1>
                <p class="hero-subtitle">Construcción y Venta de Inmuebles</p>
                <p class="hero-description">Transformamos tu sueño en realidad con exclusividad, tecnología de punta y materiales de alta calidad.</p>
            </div>
        </div>
    </div>

    <!-- Chat toggle button -->
    <button class="chat-toggle" id="chatToggle" aria-label="Abrir chat">
        <svg class="chat-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5C21.0034 12.8199 20.6951 14.1219 20.1 15.3C19.3944 16.7118 18.3098 17.8992 16.9674 18.7293C15.6251 19.5594 14.0782 19.9994 12.5 20C11.1801 20.0035 9.87812 19.6951 8.7 19.1L3 21L4.9 15.3C4.30493 14.1219 3.99656 12.8199 4 11.5C4.00061 9.92179 4.44061 8.37488 5.27072 7.03258C6.10083 5.69028 7.28825 4.6056 8.7 3.90003C9.87812 3.30496 11.1801 2.99659 12.5 3.00003H13C15.0843 3.11502 17.053 3.99479 18.5291 5.47089C20.0052 6.94699 20.885 8.91568 21 11V11.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="close-icon hidden" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="notification-badge" id="notificationBadge">1</span>
    </button>

    <!-- Chat window -->
    <div class="chat-window hidden" id="chatWindow">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="agent-avatar">
                    <span>E</span>
                    <span class="status-dot"></span>
                </div>
                <div class="agent-details">
                    <h3>Asistente Elysiva</h3>
                    <p class="agent-status">En línea</p>
                </div>
            </div>
            <button class="chat-close" id="chatClose" aria-label="Cerrar chat">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be inserted here -->
        </div>

        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" data-message="Quiero ver los proyectos disponibles">Proyectos</button>
            <button class="quick-reply-btn" data-message="Quiero información sobre precios">Precios</button>
            <button class="quick-reply-btn" data-message="Cómo puedo contactarlos?">Contacto</button>
            <button class="quick-reply-btn" data-message="Qué servicios ofrecen?">Servicios</button>
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input
                    type="text"
                    class="chat-input"
                    id="chatInput"
                    placeholder="Escribe tu mensaje..."
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn" aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <p class="chat-disclaimer">Asistente virtual de Elysiva. Para consultas detalladas, contáctenos en admin@elysiva.org</p>
        </div>
    </div>

    <script src="knowledge-base.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
